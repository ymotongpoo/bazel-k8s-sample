apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# digest は Bazel がイメージのビルドの出力から生成する Component が決める。
components:
  - ../../images
# 手元の kind のクラスタから見えるレジストリ。
images:
  - name: api
    newName: localhost:5001/bazel-k8s-sample/api
  - name: worker
    newName: localhost:5001/bazel-k8s-sample/worker
