# Bazel のリモートキャッシュのサーバー。手元の kind で試すための構成で、キャッシュはノードの emptyDir に置く。
# クライアントの証明書を持つビルドだけが書き込め、証明書を持たないビルドは読むことだけができる。
# 証明書と鍵の Secret は tools/dev/cache-certs.sh が作る。
apiVersion: v1
kind: Namespace
metadata:
  name: build
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazel-remote
  namespace: build
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bazel-remote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazel-remote
    spec:
      # Service の名前から作られる BAZEL_REMOTE_PORT などの環境変数を、bazel-remote は自分の設定として読んでしまう。
      enableServiceLinks: false
      containers:
        - name: bazel-remote
          image: buchgr/bazel-remote-cache:v2.6.4@sha256:10285c1183e606679eb450b725c2495c055a45eb532a6c80f6b6f9771f6d2f67
          args:
            - --dir=/data
            - --max_size=10
            - --tls_cert_file=/tls/server.pem
            - --tls_key_file=/tls/server.key
            - --tls_ca_file=/tls/ca.pem
            - --allow_unauthenticated_reads
          ports:
            - name: grpc
              containerPort: 9092
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 12Gi
        - name: tls
          secret:
            secretName: bazel-remote-tls
---
# kind のノードの 30092 番を、tools/dev/kind-up.sh がホストの 127.0.0.1:9092 につなぐ。
apiVersion: v1
kind: Service
metadata:
  name: bazel-remote
  namespace: build
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: bazel-remote
  ports:
    - name: grpc
      port: 9092
      targetPort: grpc
      nodePort: 30092
    - name: http
      port: 8080
      targetPort: http
